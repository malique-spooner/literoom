[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literoom"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click",
    "fastapi",
    "opencv-python-headless",
    "imagehash",
    "pillow",
    "pydantic",
    "pyyaml",
    "python-dateutil",
    "python-json-logger",
    "rich",
    "timezonefinder",
    "tqdm",
    "uvicorn",
    "openai-whisper",
    "open_clip_torch",
    "faiss-cpu",
    "ultralytics",
    "insightface",
    "paddleocr",
    "onnxruntime",
    "pi-heif",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["photo_unifier*"]

[project.scripts]
literoom = "photo_unifier.cli:main"
